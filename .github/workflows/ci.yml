name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: husic
          POSTGRES_PASSWORD: husic
          POSTGRES_DB: husic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U husic" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
        env:
          HUSIC_TEST_POSTGRES: postgres://husic:husic@127.0.0.1:5432/husic_test?sslmode=disable

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run check
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: node connect/test.mjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t husic:ci .
      - name: Start and answer
        run: |
          docker run -d --name husic -p 127.0.0.1:18788:18788 -e HUSIC_ALLOW_REMOTE=true husic:ci
          for i in $(seq 30); do curl -fs http://127.0.0.1:18788/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:18788/ | grep -q 'id="root"'
          curl -fs -o /dev/null http://127.0.0.1:18788/connect/Husic-Connect.zip
          docker logs husic
